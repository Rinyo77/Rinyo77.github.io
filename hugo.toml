baseURL = 'https://rinyo77.github.io/'
locale = 'en'
title = 'Rinyo'
timeZone = 'Etc/UTC'
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
disableHugoGeneratorInject = true
disableAliases = true

[params]
  author = 'Rinyo'
  description = 'A personal notebook on security, learning, and everyday life.'
  intro = 'Read. Tinker. Rant. RTFM.'
  demo = false
  mainSections = ['journal']

[taxonomies]
  topic = 'topics'
  tag = 'tags'

[pagination]
  disableAliases = true
  pagerSize = 10

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML']
  taxonomy = ['HTML']
  term = ['HTML']

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  noClasses = false

[security.exec]
  allow = ['^$']
  osEnv = ['^$']

[security.funcs]
  getenv = ['^HUGO_', '^CI$']

[security.http]
  methods = ['^$']
  urls = ['^$']

[module.hugoVersion]
  min = '0.146.0'

[[menus.main]]
  name = 'Journal'
  pageRef = '/'
  weight = 10

[[menus.main]]
  name = 'Topics'
  pageRef = '/topics'
  weight = 20

[[menus.main]]
  name = 'Archive'
  pageRef = '/archive'
  weight = 30

[[menus.main]]
  name = 'About'
  pageRef = '/about'
  weight = 40